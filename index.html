<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nosh — shared grocery lists</title>
    <meta name="description" content="Nosh — one grocery list, everyone in sync." />
    <meta name="theme-color" content="#0B5FFF" />

    <!-- Installable + offline. sw.js and the icons are copied to the site
         root at build time by the plugin in vite.config.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nosh" />

    <!-- Inline data-URI icons: no public/ folder needed (GitHub's web uploader flattens folders) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%230B5FFF'/><g fill='%23fff'><rect x='13.2' y='12' width='3.1' height='12' rx='1.55'/><rect x='18.4' y='12' width='3.1' height='12' rx='1.55'/><rect x='23.6' y='12' width='3.1' height='12' rx='1.55'/><path d='M13.2 22h13.5v3.2a7 7 0 0 1-5 6.7V50a1.75 1.75 0 0 1-3.5 0V31.9a7 7 0 0 1-5-6.7z'/><path d='M52 12.5C39.5 14.6 31.5 23.4 31.5 36.5c0 4.4 3.6 6.9 7.5 5.2C47.9 37.8 53 26 52 12.5z'/></g></svg>" />
    <!-- iOS home-screen icon. This must be a real file URL, not a data: URI —
         iOS won't take a data: URI here, and when it can't resolve an icon it
         falls back to a screenshot of the page, which on a dark theme is a
         black tile. The build also emits the same PNG at /apple-touch-icon.png,
         the root path iOS probes when the tag doesn't resolve. Opaque on
         purpose: iOS ignores the alpha channel and flattens onto black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/nosh-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
